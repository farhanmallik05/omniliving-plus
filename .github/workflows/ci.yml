name: OmniLiving+ CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm run install:all

    - name: Build MCP Server & Web Simulator
      run: npm run build

    - name: Run MCP Protocol Verification Tests
      run: npm test

    - name: Run Web Simulator Component Tests (Vitest)
      run: npm run test:components

    - name: Run Bedrock Multimodal Evaluation Benchmark
      run: npm run eval:bedrock
