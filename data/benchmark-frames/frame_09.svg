  <text x="40" y="72" fill="#94a3b8" font-family="monospace" font-size="14">2026-10-18 03:19:55 UTC | 1080p 30fps | Wi-Fi RSSI -52dBm | Battery: 100% (Hardwired)</text>
  <text x="1120" y="60" fill="#00ffcc" font-family="monospace" font-size="16" font-weight="bold">● IR NIGHT VISION</text>

