  <rect x="0" y="630" width="1280" height="90" fill="rgba(15,23,42,0.95)" stroke="#334155" stroke-width="1"/>
  <text x="40" y="662" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold">GROUND TRUTH EVALUATION: frame_09 (Night Perimeter Door Handle Tamper Attempt)</text>
  <text x="40" y="692" fill="#cbd5e1" font-family="sans-serif" font-size="14">Category: night_perimeter_security | Notes: Smart lock deadbolt engaged; Fire TV living room PiP alert triggered.</text>
  <text x="1100" y="678" fill="#10b981" font-family="monospace" font-size="16" font-weight="bold">PASS (94% F1)</text>
