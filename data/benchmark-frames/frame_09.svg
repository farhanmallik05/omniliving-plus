  <text x="448" y="152" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Prowler Reach Vector Detected</text>
  

  <!-- Target Bounding Box -->
  <rect x="460" y="220" width="220" height="360"
        fill="#ff111122" stroke="#ff1111" stroke-width="3" rx="4" filter="url(#glow)"/>
  <rect x="460" y="190" width="220" height="30" fill="#ff1111" rx="4"/>
