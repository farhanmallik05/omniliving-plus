<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="nightVignette" cx="50%" cy="50%" r="70%">
         <stop offset="0%" stop-color="#141a22"/>
         <stop offset="80%" stop-color="#080a0d"/>
         <stop offset="100%" stop-color="#020304"/>
       </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Camera Sensor Field -->
  <rect width="1280" height="720" fill="url(#nightVignette)"/>

  <!-- Doorstep & Porch Architecture Reference -->
  <polygon points="100,720 1180,720 980,480 300,480" fill="#11171f" opacity="0.8"/>
  <rect x="520" y="180" width="240" height="340" fill="#0d131a" stroke="#334155" stroke-width="2"/>
  <circle cx="540" cy="350" r="8" fill="#e2e8f0"/>
  <!-- Porch Mat -->
  <rect x="460" y="500" width="360" height="140" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="640" y="580" fill="#64748b" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">WELCOME</text>

  <!-- Ring Doorbell HUD Overlay Top Bar -->
  <rect x="0" y="0" width="1280" height="90" fill="rgba(0,0,0,0.7)"/>
  <text x="40" y="45" fill="#ff9900" font-family="sans-serif" font-size="22" font-weight="bold">RING PRO CAMERA 01</text>
  <text x="40" y="72" fill="#94a3b8" font-family="monospace" font-size="14">2026-10-18 19:15:02 UTC | 1080p 30fps | Wi-Fi RSSI -52dBm | Battery: 100% (Hardwired)</text>
  <text x="1120" y="60" fill="#00ffcc" font-family="monospace" font-size="16" font-weight="bold">● IR NIGHT VISION</text>

  <!-- AI Computer Vision Bounding Boxes -->
  
  <rect x="400" y="190" width="230" height="380"
        fill="rgba(59, 130, 246, 0.15)" stroke="#3b82f6" stroke-width="3" stroke-dasharray="6,4" rx="4"/>
  <rect x="400" y="162" width="230" height="28" fill="#3b82f6" rx="4"/>
  <text x="408" y="182" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">DoorDash Courier</text>
  

  <!-- Target Bounding Box -->
  <rect x="480" y="390" width="170" height="170"
        fill="#ff300822" stroke="#ff3008" stroke-width="3" rx="4" filter="url(#glow)"/>
  <rect x="480" y="360" width="170" height="30" fill="#ff3008" rx="4"/>
  <text x="490" y="380" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Delivery: Thermal Food Bag (Conf: 94.2%)</text>

  <!-- Ground Truth HUD Banner Bottom -->
  <rect x="0" y="630" width="1280" height="90" fill="rgba(15,23,42,0.95)" stroke="#334155" stroke-width="1"/>
  <text x="40" y="662" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold">GROUND TRUTH EVALUATION: frame_04 (DoorDash Food Delivery)</text>
  <text x="40" y="692" fill="#cbd5e1" font-family="sans-serif" font-size="14">Category: courier_delivery | Notes: Food bag placed on welcome mat.</text>
  <text x="1100" y="678" fill="#10b981" font-family="monospace" font-size="16" font-weight="bold">PASS (94% F1)</text>
</svg>