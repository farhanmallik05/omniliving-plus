<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="dayGrad" x1="0" y1="0" x2="0" y2="1">
         <stop offset="0%" stop-color="#2a3b4c"/>
         <stop offset="60%" stop-color="#1e293b"/>
         <stop offset="100%" stop-color="#0f172a"/>
       </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Camera Sensor Field -->
  <rect width="1280" height="720" fill="url(#dayGrad)"/>

  <!-- Doorstep & Porch Architecture Reference -->
  <polygon points="100,720 1180,720 980,480 300,480" fill="#253342" opacity="0.8"/>
  <rect x="520" y="180" width="240" height="340" fill="#1c2733" stroke="#334155" stroke-width="2"/>
  <circle cx="540" cy="350" r="8" fill="#e2e8f0"/>
  <!-- Porch Mat -->
  <rect x="460" y="500" width="360" height="140" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
  <text x="640" y="580" fill="#64748b" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">WELCOME</text>

  <!-- Ring Doorbell HUD Overlay Top Bar -->
  <rect x="0" y="0" width="1280" height="90" fill="rgba(0,0,0,0.7)"/>
  <text x="40" y="45" fill="#ff9900" font-family="sans-serif" font-size="22" font-weight="bold">RING PRO CAMERA 01</text>
  <text x="40" y="72" fill="#94a3b8" font-family="monospace" font-size="14">2026-10-18 15:02:30 UTC | 1080p 30fps | Wi-Fi RSSI -52dBm | Battery: 100% (Hardwired)</text>
  <text x="1120" y="60" fill="#00e676" font-family="monospace" font-size="16" font-weight="bold">● HDR DAYLIGHT</text>

  <!-- AI Computer Vision Bounding Boxes -->
  

  <!-- Target Bounding Box -->
  <rect x="120" y="80" width="320" height="260"
        fill="#88888822" stroke="#888888" stroke-width="3" rx="4" filter="url(#glow)"/>
  <rect x="120" y="50" width="320" height="30" fill="#888888" rx="4"/>
  <text x="130" y="70" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Motion Pre-Filter: 11% Structural (Suppressed)</text>

  <!-- Ground Truth HUD Banner Bottom -->
  <rect x="0" y="630" width="1280" height="90" fill="rgba(15,23,42,0.95)" stroke="#334155" stroke-width="1"/>
  <text x="40" y="662" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold">GROUND TRUTH EVALUATION: frame_10 (Benign Noise - Wind-Induced Branch Sway)</text>
  <text x="40" y="692" fill="#cbd5e1" font-family="sans-serif" font-size="14">Category: benign_false_positives | Notes: Wind velocity 18mph moving Japanese maple branch; discarded before LLM token spend.</text>
  <text x="1100" y="678" fill="#10b981" font-family="monospace" font-size="16" font-weight="bold">PASS (94% F1)</text>
</svg>